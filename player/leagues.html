<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Leagues - Arena Chain</title>
    <link href="../src/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .league-card:hover .league-glow {
            opacity: 1;
        }

        .custom-loader {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(#0000 10%, #00FF00);
            -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 0);
            mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 0);
            animation: s3 1s infinite linear;
        }

        @keyframes s3 {
            to {
                transform: rotate(1s);
            }
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-white font-sans antialiased h-screen flex overflow-hidden">
    <!-- Sidebar (Same as Dashboard) -->
    <aside class="w-64 bg-[#050505] border-r border-[#1a1a1a] flex flex-col justify-between">
        <div>
            <div class="p-8">
                <h1 class="text-xl font-black text-[#00FF00] tracking-widest uppercase cursor-pointer" id="homeBtn">
                    ARENA PLAYER</h1>
            </div>
            <nav class="px-4 space-y-1">
                <a href="#" id="dashboardLink"
                    class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#111] rounded-lg transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
                    </svg>
                    <span class="font-medium text-sm">Play</span>
                </a>
                <a href="#" id="profileLink"
                    class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-[#111] rounded-lg transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                    <span class="font-medium text-sm">Profile</span>
                </a>
                <a href="#"
                    class="flex items-center gap-4 px-4 py-3 bg-[#111] text-[#00FF00] rounded-lg border-l-4 border-[#00FF00] transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-2.25c-.622 0-1.125.504-1.125 1.125V18.75m9 0V15.75m-9 3V15.75m0 0V4.5a2.25 2.25 0 0 1 2.25-2.25h2.25A2.25 2.25 0 0 1 18 4.5v11.25m-1.125-11.25h1.125m-11.25 4.5h1.125M7.5 12h1.125m-1.125 4.5h1.125" />
                    </svg>
                    <span class="font-bold text-sm">Leagues</span>
                </a>
            </nav>
        </div>
        <div class="p-4">
            <button id="logoutBtn"
                class="flex items-center gap-4 px-4 py-3 text-red-500 hover:text-red-400 hover:bg-[#1a0505] rounded-lg transition-all w-full">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                </svg>
                <span class="font-bold text-sm">Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-[#0a0a0a] p-10">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div>
                <h2 class="text-4xl font-black uppercase tracking-tighter text-white">Official Leagues</h2>
                <p class="text-gray-500 text-sm mt-1 uppercase tracking-widest font-medium">Seasonal Platform
                    Competitions</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="relative group">
                    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-green-500"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="leagueSearch" placeholder="SEARCH LEAGUES..."
                        class="bg-[#111] border border-white/5 pl-10 pr-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest focus:outline-none focus:border-green-500/50 w-64 transition-all">
                </div>
                <select id="tierFilter"
                    class="bg-[#111] border border-white/5 px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest focus:outline-none focus:border-green-500/50 transition-all text-gray-300">
                    <option value="all">ALL TIERS</option>
                    <option value="OFFICIAL">OFFICIAL</option>
                    <option value="COMMUNITY">COMMUNITY</option>
                </select>
                <select id="statusFilter"
                    class="bg-[#111] border border-white/5 px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest focus:outline-none focus:border-green-500/50 transition-all text-gray-300">
                    <option value="all">ALL STATUS</option>
                    <option value="UPCOMING">UPCOMING</option>
                    <option value="ONGOING">ONGOING</option>
                    <option value="FINISHED">FINISHED</option>
                </select>
            </div>
        </div>

        <!-- Leagues Grid -->
        <div id="leaguesListing" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 gap-4 opacity-50">
                <div class="custom-loader"></div>
                <span class="text-xs font-black uppercase tracking-widest">Loading Official Leagues...</span>
            </div>
        </div>

        <!-- Standings Modal (Revamped) -->
        <div id="standingsModal"
            class="fixed inset-0 bg-black/95 backdrop-blur-md hidden z-50 flex items-center justify-center p-0 md:p-10">
            <div
                class="bg-[#0b0b0b] border border-white/5 rounded-none md:rounded-[32px] w-full max-w-6xl h-full md:h-auto md:max-h-[90vh] overflow-hidden shadow-2xl flex flex-col">

                <!-- Modal Top Bar -->
                <div class="bg-[#121212] px-8 py-4 border-b border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button id="closeModal"
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all text-white/50 hover:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </button>
                        <span id="modalHeaderLeagueName"
                            class="text-white font-black text-[10px] uppercase tracking-tighter"></span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-green-500/20 border border-green-500/30 flex items-center justify-center">
                            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-7.714 2.143L11 21l-2.286-6.857L1 12l7.714-2.143L11 3z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Modal Content -->
                <div class="flex-1 overflow-y-auto px-10 py-10">


                    <div class="flex items-center justify-between mb-10">
                        <div class="flex items-center gap-3">
                            <h3 id="modalLeagueName" class="text-2xl font-black uppercase tracking-tighter text-white">
                            </h3>
                        </div>
                        <div class="flex flex-col gap-4 items-end">
                            <!-- Continents -->
                            <div class="flex flex-wrap gap-2 justify-end" id="continentFilters">
                                <div data-continent="GLOBAL"
                                    class="continent-btn active bg-primary text-black border border-primary px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest cursor-pointer">
                                    GLOBAL
                                </div>
                                <div data-continent="AFRICA"
                                    class="continent-btn bg-[#1a1a1a] border border-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-text-muted hover:text-white cursor-pointer">
                                    AFRIQUE
                                </div>
                                <div data-continent="ASIA"
                                    class="continent-btn bg-[#1a1a1a] border border-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-text-muted hover:text-white cursor-pointer">
                                    ASIE
                                </div>
                                <div data-continent="EUROPE"
                                    class="continent-btn bg-[#1a1a1a] border border-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-text-muted hover:text-white cursor-pointer">
                                    EUROPE
                                </div>
                                <div data-continent="AMERICAS"
                                    class="continent-btn bg-[#1a1a1a] border border-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-text-muted hover:text-white cursor-pointer">
                                    AMÉRIQUES
                                </div>
                                <div data-continent="OCEANIA"
                                    class="continent-btn bg-[#1a1a1a] border border-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-text-muted hover:text-white cursor-pointer">
                                    OCÉANIE
                                </div>
                            </div>

                        </div>

                        <table class="w-full text-left">
                            <thead>
                                <tr
                                    class="text-[10px] font-black uppercase tracking-widest text-[#444] border-b border-white/5">
                                    <th class="pb-4">Classement</th>
                                    <th class="pb-4">Joueur</th>

                                    <th class="pb-4 text-center">Niveau de compétence</th>
                                    <th class="pb-4 text-right">ELO</th>
                                </tr>
                            </thead>
                            <tbody id="standingsBody">
                                <!-- JS injected rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
    </main>

    <script src="leagues-renderer.js"></script>
</body>

</html>
