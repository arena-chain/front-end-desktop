<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Manager Dashboard - Arena Chain</title>
    <link href="../output.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-white font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-purple-500 flex items-center gap-2">
                <span>🛡️</span> Arena Chain
            </h1>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" class="block px-4 py-3 bg-gray-700 text-white rounded-lg font-medium">Dashboard</a>
            <a href="#"
                class="block px-4 py-3 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">My
                Team</a>
            <a href="#"
                class="block px-4 py-3 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Roster
                Management</a>
            <a href="#"
                class="block px-4 py-3 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Scrims</a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <button id="logoutBtn"
                class="w-full py-2 bg-red-600 bg-opacity-20 text-red-400 hover:bg-opacity-30 rounded-lg transition text-sm font-semibold">
                Log Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-bold">Team Manager</h2>
                <p class="text-gray-400">Managing: <span class="text-purple-400 font-bold">Team Alpha</span></p>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center">M</div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Roster Size</h3>
                <p class="text-3xl font-bold">5/7</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Team Rank</h3>
                <p class="text-3xl font-bold text-purple-400">#42</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Next Scrim</h3>
                <p class="text-sm font-bold text-gray-300 mt-2">Vs. Team Bravo<br><span
                        class="text-gray-500 font-normal">Tomorrow, 18:00</span></p>
            </div>
        </div>

        <!-- Roster List -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="p-6 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-bold">Active Roster</h3>
                <button
                    class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm font-semibold transition">Invite
                    Player</button>
            </div>
            <ul class="divide-y divide-gray-700">
                <li class="p-4 flex items-center justify-between hover:bg-gray-750">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-700 rounded-full"></div>
                        <span class="font-medium">PlayerOne</span>
                        <span class="text-xs bg-purple-900 text-purple-300 px-2 py-0.5 rounded">Captain</span>
                    </div>
                </li>
                <li class="p-4 flex items-center justify-between hover:bg-gray-750">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-700 rounded-full"></div>
                        <span class="font-medium">PlayerTwo</span>
                    </div>
                </li>
            </ul>
        </div>
    </main>

    <script src="renderer.js"></script>
</body>

</html>
