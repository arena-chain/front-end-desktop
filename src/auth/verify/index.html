<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Arena Chain</title>
    <link href="../../output.css" rel="stylesheet">
    <style>
        .otp-input {
            width: 52px; height: 60px;
            text-align: center; font-size: 24px; font-weight: 800;
            background: #1a1a1a; border: 1.5px solid #374151; border-radius: 12px;
            color: #fff; outline: none; transition: all 0.2s;
            caret-color: #00ff00;
        }
        .otp-input:focus { border-color: #00ff00; box-shadow: 0 0 0 2px rgba(0,255,0,0.15); }
        .otp-input.filled { border-color: #00ff00; background: rgba(0,255,0,0.04); }
    </style>
</head>

<body class="bg-black text-white font-sans antialiased h-screen flex items-center justify-center overflow-hidden relative selection:bg-green-500 selection:text-black">

    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 to-black z-0"></div>

    <div class="relative z-10 w-full max-w-[460px] bg-[#0f0f0f] border border-gray-800 rounded-3xl p-8 shadow-2xl">

        <div class="flex flex-col items-center mb-8">
            <div class="w-14 h-14 bg-gray-800 rounded-2xl flex items-center justify-center mb-5 border border-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#00ff00" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide uppercase">Verify Your Email</h1>
            <p class="text-gray-500 text-sm mt-2 text-center max-w-[320px]">
                We sent a 6-digit code to <span id="verify-email-display" class="text-[#00ff00] font-semibold">your email</span>. Enter it below.
            </p>
        </div>

        <form id="verifyForm" class="flex flex-col items-center">
            <div id="otp-container" class="flex gap-3 mb-6">
                <input type="text" maxlength="1" class="otp-input" data-idx="0" inputmode="numeric" autocomplete="one-time-code" autofocus>
                <input type="text" maxlength="1" class="otp-input" data-idx="1" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-input" data-idx="2" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-input" data-idx="3" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-input" data-idx="4" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-input" data-idx="5" inputmode="numeric">
            </div>

            <p id="verify-error" class="text-red-500 text-xs font-semibold mb-4 text-center hidden"></p>
            <p id="verify-success" class="text-[#00ff00] text-xs font-semibold mb-4 text-center hidden"></p>

            <button id="verify-btn" type="submit"
                class="w-full py-3 bg-[#00ff00] text-black font-extrabold uppercase tracking-wide rounded-sm shadow-[0_0_15px_rgba(0,255,0,0.3)] hover:bg-[#00cc00] hover:shadow-[0_0_20px_rgba(0,255,0,0.5)] transition-all duration-200 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                disabled>
                Verify & Create Account
            </button>
        </form>

        <div class="mt-6 flex flex-col items-center gap-3">
            <p class="text-gray-500 text-xs">Didn't receive the code?</p>
            <button id="resend-btn" class="text-[#00ff00] text-sm font-bold hover:text-[#00cc00] transition-colors">
                Resend Code
            </button>
            <p id="resend-msg" class="text-gray-500 text-xs hidden"></p>
        </div>

        <div class="mt-6 text-center">
            <a href="#" id="back-to-register" class="text-gray-400 hover:text-white text-sm flex items-center justify-center gap-1 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Back to Register
            </a>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
