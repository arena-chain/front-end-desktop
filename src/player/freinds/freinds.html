<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA - Friends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #0a0b0f;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0b0f;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 135, 0.3);
            border-radius: 10px;
        }

        .glass-panel {
            background: rgba(18, 20, 28, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .neon-green-glow {
            box-shadow: 0 0 20px rgba(0, 255, 135, 0.5), 0 0 40px rgba(0, 255, 135, 0.2);
        }

        .nav-menu-btn.active {
            background: rgba(0, 255, 135, 0.15);
            color: #00ff87;
        }

        .sidebar-collapsible {
            width: 90px;
            position: relative;
            z-index: 20;
            overflow: visible !important;
            transition: width 0.3s ease;
        }

        .sidebar-collapsible:hover { width: 250px; }

        .sidebar-collapsible .sidebar-brand-text,
        .sidebar-collapsible .sidebar-section-title,
        .sidebar-collapsible .sidebar-profile-text {
            display: none;
        }

        .sidebar-collapsible:hover .sidebar-brand-text,
        .sidebar-collapsible:hover .sidebar-section-title,
        .sidebar-collapsible:hover .sidebar-profile-text {
            display: block;
        }

        .sidebar-scroll-area {
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            width: 100%; min-height: 0;}

        .sidebar-collapsible .sidebar-menu-btn,
        .sidebar-collapsible .game-select-btn {
            position: relative;
            justify-content: center;
            align-items: center;
            width: 46px;
            height: 40px;
            margin-left: auto;
            margin-right: auto;
            overflow: visible;
            z-index: 30;
            padding-left: 0 !important;
            padding-right: 0 !important;
            transition: all 0.22s ease;
        }

        .sidebar-collapsible:hover .sidebar-menu-btn,
        .sidebar-collapsible:hover .game-select-btn {
            width: 100%;
            justify-content: flex-start;
            padding-left: 16px !important;
            padding-right: 16px !important;
        }

        .sidebar-collapsible .sidebar-label {
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.2s ease;
            position: absolute;
            left: 50px;
        }

        .sidebar-collapsible:hover .sidebar-label {
            opacity: 1;
        }
    </style>
    <script src="../_common/loadComponents.js"></script>
</head>

<body class="bg-[#0a0b0f] text-white antialiased h-screen overflow-hidden m-0">

    <div class="flex w-full min-w-0 h-full overflow-hidden">

        <common-navbar src="left_side_navbar.html"></common-navbar>

        <!-- Main Content Area -->
        <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
            <common-navbar src="top_navbar.html"></common-navbar>

            <!-- Friends Content -->
            <div class="flex-1 overflow-y-auto overflow-x-hidden p-6 lg:p-10">

                <!-- Header row: title + search -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                    <h1 class="text-4xl font-black text-white uppercase tracking-wider">Friends</h1>

                    <!-- Search -->
                    <div class="relative w-full sm:w-80">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input id="search-input" type="text" placeholder="Search users by name or email..."
                               class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#00ff87]/40 focus:bg-white/[0.07] transition-all">

                        <!-- Search dropdown -->
                        <div id="search-results" class="hidden absolute top-full left-0 right-0 mt-2 glass-panel rounded-xl max-h-72 overflow-y-auto z-50"></div>
                    </div>
                </div>

                <!-- Tabs -->
                <div id="friend-tabs" class="flex flex-wrap gap-2 mb-8"></div>

                <!-- Friend list content -->
                <div id="friend-content" class="flex flex-col gap-3"></div>
            </div>
        </main>
    </div>

    <script src="./renderer.js"></script>
</body>
</html>
