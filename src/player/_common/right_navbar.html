<!-- Right Sidebar - Currently Playing, Friends & DMs -->
<style>
    .right-rail-scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .right-rail-scrollbar-hide::-webkit-scrollbar { display: none; width: 0; height: 0; }

    #dm-popup-overlay:not(.hidden) {
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
<aside class="flex flex-col flex-1 min-h-0 w-full bg-[#12141c]">

    <!-- Currently Playing Card -->
    <div class="p-5 border-b border-white/5 flex-shrink-0">
        <div class="glass-panel rounded-2xl p-4 text-center">
            <div class="w-14 h-14 mx-auto mb-3 rounded-xl bg-[#ff4654] flex items-center justify-center neon-green-glow shrink-0">
                <span class="text-lg font-black text-white">V</span>
            </div>
            <h3 class="text-base font-bold text-white mb-0.5">VALORANT</h3>
            <p class="text-[11px] text-gray-500 mb-3">Currently Selected</p>
            <div class="flex items-center justify-center gap-4 text-sm">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wide">Online</p>
                    <p class="text-base font-black text-[#00ff87]">2.3K</p>
                </div>
                <div class="w-px h-7 bg-white/10"></div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wide">In Queue</p>
                    <p class="text-base font-black text-white">347</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Friends + conversation -->
    <div class="flex-1 flex flex-col min-h-0 bg-[#12141c]">
        <div class="px-5 pt-4 pb-2 flex-shrink-0 bg-[#12141c]">
            <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Connected</h3>
            <p class="text-[11px] text-gray-600 mt-0.5">Tap a friend to open your chat history</p>
        </div>

        <div class="right-rail-scrollbar-hide flex-1 overflow-y-auto px-5 pb-3 min-h-0 bg-[#12141c]">
            <div class="space-y-2" id="friends-connected-list">
                <button type="button" data-friend-id="sarah"
                    class="friend-row w-full flex items-center gap-3 p-3 rounded-xl text-left transition-all hover:bg-white/5 border border-transparent hover:border-white/10">
                    <div class="relative flex-shrink-0">
                        <div class="w-10 h-10 rounded-lg overflow-hidden ring-2 ring-[#ff4654]/60">
                            <img src="https://ui-avatars.com/api/?name=Sarah+K&background=ff4654&color=fff" alt="" class="h-full w-full shrink-0 object-cover" />
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-[#ff4654] border-2 border-[#12141c] rounded-full" title="In game"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate">Sarah K.</p>
                        <p class="text-[11px] text-[#ff4654] truncate">In game · Valorant · Ascent</p>
                    </div>
                </button>

                <button type="button" data-friend-id="mike"
                    class="friend-row w-full flex items-center gap-3 p-3 rounded-xl text-left transition-all hover:bg-white/5 border border-transparent hover:border-white/10">
                    <div class="relative flex-shrink-0">
                        <div class="w-10 h-10 rounded-lg overflow-hidden ring-2 ring-[#0bc6e3]/60">
                            <img src="https://ui-avatars.com/api/?name=Mike+R&background=0bc6e3&color=0a0b0f" alt="" class="h-full w-full shrink-0 object-cover" />
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-[#00ff87] border-2 border-[#12141c] rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate">Mike R.</p>
                        <p class="text-[11px] text-[#0bc6e3] truncate">In queue · League · Ranked Solo/Duo</p>
                    </div>
                </button>

                <button type="button" data-friend-id="alex"
                    class="friend-row w-full flex items-center gap-3 p-3 rounded-xl text-left transition-all hover:bg-white/5 border border-transparent hover:border-white/10">
                    <div class="relative flex-shrink-0">
                        <div class="w-10 h-10 rounded-lg overflow-hidden ring-2 ring-[#a855f7]/50">
                            <img src="https://ui-avatars.com/api/?name=Alex+J&background=a855f7&color=fff" alt="" class="h-full w-full shrink-0 object-cover" />
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-amber-400 border-2 border-[#12141c] rounded-full" title="Away"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate">Alex J.</p>
                        <p class="text-[11px] text-amber-400/90 truncate">Away · Was in League client</p>
                    </div>
                </button>

                <button type="button" data-friend-id="emma"
                    class="friend-row w-full flex items-center gap-3 p-3 rounded-xl text-left transition-all hover:bg-white/5 border border-transparent hover:border-white/10">
                    <div class="relative flex-shrink-0">
                        <div class="w-10 h-10 rounded-lg overflow-hidden ring-2 ring-[#00ff87]">
                            <img src="https://ui-avatars.com/api/?name=Emma+L&background=ec4899&color=fff" alt="" class="h-full w-full shrink-0 object-cover" />
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-[#00ff87] border-2 border-[#12141c] rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate">Emma L.</p>
                        <p class="text-[11px] text-gray-500 truncate">Online · In lobby</p>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Party -->
    <div class="p-4 border-t border-white/5 flex-shrink-0 bg-[#12141c]">
        <button type="button"
            class="w-full py-3.5 bg-[#00ff87] hover:bg-[#00e67a] text-[#0a0b0f] font-black rounded-xl transition-all neon-green-glow uppercase tracking-wide text-sm flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            CREATE PARTY
        </button>
    </div>
</aside>

<!-- Messages popup (fixed overlay; opens when a friend row is clicked) -->
<div id="dm-popup-overlay"
    class="fixed inset-0 z-[10020] hidden p-4 bg-black/70 backdrop-blur-sm overflow-y-auto right-rail-scrollbar-hide"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dm-friend-name">
    <div id="dm-popup-card"
        class="w-full max-w-lg rounded-2xl border border-white/10 bg-[#12141c] shadow-2xl flex flex-col max-h-[min(85vh,560px)] min-h-0 overflow-hidden my-auto">
        <div class="flex items-start justify-between gap-3 px-5 py-4 border-b border-white/10">
            <div class="min-w-0">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Conversation</p>
                <p id="dm-friend-name" class="text-lg font-bold text-white truncate">—</p>
                <p class="text-[11px] text-gray-500 mt-0.5">Message history with this friend</p>
            </div>
            <button type="button" id="dm-close"
                class="flex-shrink-0 p-2 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 transition-colors"
                aria-label="Close messages">✕</button>
        </div>
        <div id="dm-messages"
            class="right-rail-scrollbar-hide flex-1 min-h-0 overflow-y-auto px-4 py-3 space-y-3 text-[13px] min-h-[200px]">
        </div>
        <div class="px-4 py-3 border-t border-white/10 bg-[#0d0f16]/80">
            <p class="text-[10px] text-gray-600 text-center">Demo — connect your chat API to send messages</p>
        </div>
    </div>
</div>
