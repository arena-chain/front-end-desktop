<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Training - Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; cursor: crosshair !important; }
        body { background: #080B14; margin: 0; overflow: hidden; height: 100vh; color: white; -webkit-user-select: none; user-select: none; }
        canvas { display: block; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        .hud-panel {
            background: rgba(18, 20, 28, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            pointer-events: none;
        }
        .combo-text {
            text-shadow: 0 0 20px rgba(0, 255, 135, 0.5);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bonus-popup {
            position: absolute;
            pointer-events: none;
            animation: float-up 0.5s ease-out forwards;
            font-weight: 900;
            font-size: 14px;
        }
        @keyframes float-up {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-30px); opacity: 0; }
        }
        .flash-red { animation: flash-red 0.2s ease-out; }
        @keyframes flash-red {
            0% { background: rgba(255, 0, 0, 0); }
            50% { background: rgba(255, 0, 0, 0.2); }
            100% { background: rgba(255, 0, 0, 0); }
        }
        @keyframes screen-shake {
            0% { transform: translate(0px, 0px); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-10px, -5px); }
            80% { transform: translate(10px, 5px); }
            100% { transform: translate(0px, 0px); }
        }
        .screen-shake {
            animation: screen-shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }
        .hit-quality {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            z-index: 100;
            animation: hit-float 0.6s ease-out forwards;
        }
        @keyframes hit-float {
            0% { transform: translate(-50%, 0px) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -20px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
        }
        .text-perfect { color: #00ff87; text-shadow: 0 0 20px rgba(0, 255, 135, 0.8); font-size: 20px; }
        .text-good { color: #facc15; text-shadow: 0 0 15px rgba(250, 204, 21, 0.5); font-size: 16px; }
        .text-bad { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); font-size: 14px; }
    </style>
</head>
<body class="bg-[#080B14]">
    <div id="game-overlay" class="absolute inset-0 pointer-events-none transition-all duration-200"></div>
    
    <!-- Top HUD -->
    <div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-start z-50">
        <div class="hud-panel rounded-2xl px-6 py-3 flex gap-8">
            <div>
                <p class="text-[10px] font-black text-gray-500 tracking-widest uppercase">Score</p>
                <p id="hud-score" class="text-2xl font-black text-white">000,000</p>
            </div>
            <div class="border-l border-white/10 pl-8">
                <p class="text-[10px] font-black text-gray-500 tracking-widest uppercase">Accuracy</p>
                <p id="hud-accuracy" class="text-2xl font-black text-[#00ff87]">100%</p>
            </div>
            <div class="border-l border-white/10 pl-8">
                <p class="text-[10px] font-black text-gray-500 tracking-widest uppercase">Time Remaining</p>
                <p id="hud-timer" class="text-2xl font-black text-white">00:00</p>
            </div>
            <div class="border-l border-white/10 pl-8 flex items-center">
                <button id="exit-btn" class="px-4 py-2 bg-red-500/10 border border-red-500/20 text-red-500 text-[10px] font-black rounded-lg hover:bg-red-500 hover:text-white transition-all pointer-events-auto">
                    EXIT
                </button>
            </div>
        </div>

        <div class="flex flex-col items-end gap-2">
            <div id="combo-container" class="hud-panel rounded-2xl px-6 py-4 text-center min-w-[120px]">
                <p class="text-[10px] font-black text-gray-500 tracking-widest uppercase mb-1">Combo Multiplier</p>
                <p id="hud-multiplier" class="text-xl font-black text-[#00ff87]">x1.0</p>
                <p id="hud-combo" class="text-3xl font-black text-white combo-text">0</p>
            </div>
            <div class="hud-panel rounded-xl px-4 py-2 flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-[#00ff87] animate-pulse"></div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest" id="difficulty-label">MEDIUM MODE</p>
            </div>
        </div>
    </div>

    <!-- Background Grid for Reference -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none" 
         style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 50px 50px;">
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Overlay -->
    <div id="start-screen" class="absolute inset-0 flex items-center justify-center z-[100] bg-[#0a0b0f]/80 backdrop-blur-md">
        <div class="text-center">
            <h2 class="text-6xl font-black mb-4 tracking-tighter">READY?</h2>
            <p class="text-gray-400 mb-8 uppercase tracking-[0.3em] font-medium">Click anywhere to begin initialization</p>
            <div class="flex gap-4 justify-center">
                <div class="px-4 py-2 rounded-lg bg-white/5 border border-white/10 uppercase text-[10px] font-black tracking-widest" id="info-difficulty">MEDIUM</div>
                <div class="px-4 py-2 rounded-lg bg-white/5 border border-white/10 uppercase text-[10px] font-black tracking-widest" id="info-duration">60 SECONDS</div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
