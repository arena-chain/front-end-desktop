<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA — Example page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0a0b0f; margin: 0; overflow: hidden; height: 100vh; }
    </style>
    <script src="../components/shell-loader.js"></script>
</head>
<body class="bg-[#0a0b0f] text-white antialiased h-screen overflow-hidden m-0">
    <div class="flex w-full min-w-0 h-full overflow-hidden">
        <common-navbar src="sidebar.html"></common-navbar>
        <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
            <common-navbar src="topbar.html"></common-navbar>
            <div class="flex-1 overflow-y-auto overflow-x-hidden p-6 lg:p-10">
                <h1 class="text-3xl font-black text-white mb-2">Example page</h1>
                <p class="text-gray-400 max-w-xl mb-6">
                    This file shows the standard player layout: shared sidebar and top bar from
                    <code class="text-[#00ff87]">src/player/components/</code>, with only this scroll area unique to the screen.
                </p>
                <div class="rounded-2xl border border-white/10 bg-[#12141c]/80 p-6 max-w-lg">
                    <p class="text-sm text-gray-300">Add your feature markup or mount scripts here. Register a route in
                        <code class="text-gray-500">electron/routes.js</code> when you need deep links from IPC.</p>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var lb = document.getElementById('logoutBtn');
            if (lb) lb.addEventListener('click', function () {
                try { require('../../../shared/api').logout(); } catch (e) {}
            });
        });
    </script>
</body>
</html>
