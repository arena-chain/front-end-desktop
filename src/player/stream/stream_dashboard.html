<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA - Streams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #0a0b0f;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0b0f;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 135, 0.3);
            border-radius: 10px;
        }

        .glass-panel {
            background: rgba(18, 20, 28, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-menu-btn.active {
            background: rgba(0, 255, 135, 0.15);
            color: #00ff87;
        }

        .sidebar-collapsible {
            width: 90px;
            position: relative;
            z-index: 20;
            overflow: visible !important;
            transition: width 0.3s ease;
        }

        .sidebar-collapsible:hover { width: 250px; }

        .sidebar-collapsible .sidebar-brand-text,
        .sidebar-collapsible .sidebar-section-title,
        .sidebar-collapsible .sidebar-profile-text {
            display: none;
        }

        .sidebar-collapsible:hover .sidebar-brand-text,
        .sidebar-collapsible:hover .sidebar-section-title,
        .sidebar-collapsible:hover .sidebar-profile-text {
            display: block;
        }

        .sidebar-scroll-area {
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            width: 100%; min-height: 0;}

        .sidebar-collapsible .sidebar-menu-btn,
        .sidebar-collapsible .game-select-btn {
            position: relative;
            justify-content: center;
            align-items: center;
            width: 46px;
            height: 40px;
            margin-left: auto;
            margin-right: auto;
            overflow: visible;
            z-index: 30;
            padding-left: 0 !important;
            padding-right: 0 !important;
            transition: all 0.22s ease;
        }

        .sidebar-collapsible:hover .sidebar-menu-btn,
        .sidebar-collapsible:hover .game-select-btn {
            width: 100%;
            justify-content: flex-start;
            padding-left: 16px !important;
            padding-right: 16px !important;
        }

        .sidebar-collapsible .sidebar-label {
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.2s ease;
            position: absolute;
            left: 50px;
        }

        .sidebar-collapsible:hover .sidebar-label {
            opacity: 1;
        }
    </style>
    <script src="../_common/loadComponents.js"></script>
</head>

<body class="bg-[#0a0b0f] text-white antialiased h-screen overflow-hidden m-0">
    <div class="flex w-full min-w-0 h-full overflow-hidden">
        <common-navbar src="left_side_navbar.html"></common-navbar>
        <main class="flex-1 min-w-0 flex flex-col overflow-hidden relative">
            <common-navbar src="top_navbar.html"></common-navbar>
            <div class="flex-1 overflow-y-auto overflow-x-hidden p-6 lg:p-10">
                <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
                    <div>
                        <h1 class="text-4xl font-black text-white uppercase tracking-wider mb-2">Live Streams</h1>
                        <p class="text-gray-400 text-sm">Discover real live streams from the backend and open the
                            currently active channels.</p>
                    </div>
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <div class="relative w-full md:w-72">
                            <input id="stream-search" type="text" placeholder="Search streamers, games..."
                                class="w-full bg-[#12141c] border border-white/10 text-white rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none focus:border-[#00ff87] transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-4 mb-8">
                    <div class="flex items-center gap-3 overflow-x-auto">
                        <button
                            class="px-5 py-2.5 bg-[#00ff87]/10 text-[#00ff87] font-bold text-sm rounded-xl border border-[#00ff87]/30 whitespace-nowrap">Explore
                            All</button>
                    </div>
                    <button id="refresh-streams"
                        class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white font-bold text-sm rounded-xl border border-white/10">Refresh</button>
                </div>

                <div id="streams-status" class="text-sm text-gray-500 mb-6">Loading live streams...</div>
                <div id="streams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                </div>
            </div>
        </main>
    </div>

    <script>
        const { getLiveStreams } = require('../../../shared/creator');

        const streamsGrid = document.getElementById('streams-grid');
        const streamsStatus = document.getElementById('streams-status');
        const searchInput = document.getElementById('stream-search');
        const refreshBtn = document.getElementById('refresh-streams');

        let allStreams = [];

        function buildCard(stream) {
            const channel = stream.channelId || {};
            const channelId = channel._id || '';
            const channelName = channel.name || stream.title || 'Live Channel';
            const avatar = channel.avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(channelName)}&background=00ff87&color=0a0b0f&size=64`;
            const tags = (stream.tags || []).slice(0, 3);
            const thumbnail = stream.thumbnailUrl || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop';
            const viewers = Number(stream.viewerCount || 0).toLocaleString();
            const title = stream.title || 'Untitled Live';

            return `
                <div class="group cursor-pointer flex flex-col" onclick="${channelId ? `window.location.href='stream.html?channelId=${channelId}'` : ''}">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden mb-3 border border-white/5 group-hover:border-[#00ff87]/50 transition-colors">
                        <img src="${thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Stream Thumbnail">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                        <div class="absolute top-3 left-3 flex items-center gap-1.5 px-2 py-1 bg-[#ff4654] text-white text-[10px] font-black rounded tracking-widest leading-none">
                            <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> LIVE
                        </div>
                        <div class="absolute bottom-3 left-3 px-2 py-1 bg-black/60 backdrop-blur rounded text-white text-xs font-bold leading-none">
                            ${viewers} Viewers
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="relative">
                            <img src="${avatar}" class="w-10 h-10 rounded-full border border-white/10" alt="Avatar">
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-[#ff4654] border-2 border-[#0a0b0f] rounded-full"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-bold text-white truncate group-hover:text-[#00ff87] transition-colors leading-tight mb-0.5">${title}</h3>
                            <p class="text-[12px] text-gray-400 truncate mb-1.5">${channelName}</p>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                ${tags.map((tag) => `<span class="px-1.5 py-0.5 bg-white/10 text-gray-300 text-[10px] font-semibold rounded leading-none">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStreams() {
            const query = (searchInput.value || '').trim().toLowerCase();
            const filtered = allStreams.filter((stream) => {
                const title = (stream.title || '').toLowerCase();
                const channel = ((stream.channelId && stream.channelId.name) || '').toLowerCase();
                const tags = (stream.tags || []).join(' ').toLowerCase();
                return !query || title.includes(query) || channel.includes(query) || tags.includes(query);
            });

            if (!filtered.length) {
                streamsGrid.innerHTML = '';
                streamsStatus.textContent = query ? 'No live streams match your search.' : 'No active live streams found.';
                return;
            }

            streamsStatus.textContent = `${filtered.length} live stream(s) found.`;
            streamsGrid.innerHTML = filtered.map(buildCard).join('');
        }

        async function loadStreams() {
            streamsStatus.textContent = 'Loading live streams...';
            try {
                allStreams = await getLiveStreams();
                renderStreams();
            } catch (error) {
                streamsGrid.innerHTML = '';
                streamsStatus.textContent = error.message || 'Failed to load live streams.';
            }
        }

        searchInput.addEventListener('input', renderStreams);
        refreshBtn.addEventListener('click', () => { void loadStreams(); });
        void loadStreams();
    </script>
</body>

</html>
