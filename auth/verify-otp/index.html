<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Arena Chain</title>
    <link href="../../src/output.css" rel="stylesheet">
</head>

<body
    class="bg-black text-white font-sans antialiased h-screen flex items-center justify-center overflow-hidden relative">
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 to-black z-0"></div>
    <div
        class="relative z-10 w-full max-w-[450px] bg-[#0f0f0f] border border-gray-800 rounded-3xl p-8 shadow-2xl flex flex-col items-center">
        <div
            class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center mb-6 border border-gray-700 text-green-500">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M7.864 4.243A4.477 4.477 0 0 0 5.25 8.25v.5c0 .414-.336.75-.75.75s-.75-.336-.75-.75v-.5a6 6 0 0 1 3.493-5.464l.011-.005a1.125 1.125 0 1 1 1.11 1.962l-.01.005Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 21a9.003 9.003 0 0 0 8.354-5.646 1.125 1.125 0 0 0-2.097-.808A6.75 6.75 0 0 1 12 18.75a6.75 6.75 0 0 1-6.257-4.204 1.125 1.125 0 1 0-2.097.808A9.003 9.003 0 0 0 12 21Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 3a9 9 0 0 1 8.354 5.646 1.125 1.125 0 0 1-2.097.808A6.75 6.75 0 0 0 12 5.25a6.75 6.75 0 0 0-6.257 4.204 1.125 1.125 0 0 1-2.097-.808A9 9 0 0 1 12 3Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wide uppercase mb-2">Verify OTP</h1>
        <p class="text-gray-500 text-sm text-center mb-8">Enter the 6-digit code sent to your email.</p>

        <form id="verifyOtpForm" class="w-full space-y-6">
            <div class="flex justify-between gap-2" id="otpContainer">
                <input type="text" maxlength="1"
                    class="otp-input w-12 h-14 bg-[#1a1a1a] border border-gray-700 rounded-lg text-center text-xl font-bold text-green-500 focus:border-green-500 outline-none">
                <input type="text" maxlength="1"
                    class="otp-input w-12 h-14 bg-[#1a1a1a] border border-gray-700 rounded-lg text-center text-xl font-bold text-green-500 focus:border-green-500 outline-none">
                <input type="text" maxlength="1"
                    class="otp-input w-12 h-14 bg-[#1a1a1a] border border-gray-700 rounded-lg text-center text-xl font-bold text-green-500 focus:border-green-500 outline-none">
                <input type="text" maxlength="1"
                    class="otp-input w-12 h-14 bg-[#1a1a1a] border border-gray-700 rounded-lg text-center text-xl font-bold text-green-500 focus:border-green-500 outline-none">
                <input type="text" maxlength="1"
                    class="otp-input w-12 h-14 bg-[#1a1a1a] border border-gray-700 rounded-lg text-center text-xl font-bold text-green-500 focus:border-green-500 outline-none">
                <input type="text" maxlength="1"
                    class="otp-input w-12 h-14 bg-[#1a1a1a] border border-gray-700 rounded-lg text-center text-xl font-bold text-green-500 focus:border-green-500 outline-none">
            </div>
            <button type="submit"
                class="w-full py-3 bg-[#00ff00] text-black font-extrabold uppercase tracking-wide rounded-sm shadow-[0_0_15px_rgba(0,255,0,0.3)] hover:bg-[#00cc00] transition-all">
                Verify
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            Didn't receive the code?
            <a href="#" id="resendOtp"
                class="text-[#00ff00] hover:text-[#00cc00] font-bold transition duration-200">Resend OTP</a>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
