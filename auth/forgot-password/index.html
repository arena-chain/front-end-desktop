<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Arena Chain</title>
    <link href="../../src/output.css" rel="stylesheet">
</head>

<body
    class="bg-black text-white font-sans antialiased h-screen flex items-center justify-center overflow-hidden relative">
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 to-black z-0"></div>
    <div
        class="relative z-10 w-full max-w-[450px] bg-[#0f0f0f] border border-gray-800 rounded-3xl p-8 shadow-2xl flex flex-col items-center">
        <div
            class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center mb-6 border border-gray-700 text-green-500">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wide uppercase mb-2">Forgot Password</h1>
        <p class="text-gray-500 text-sm text-center mb-8">Enter your email address and we'll send you an OTP to reset
            your password.</p>

        <form id="forgotPasswordForm" class="w-full space-y-6">
            <div>
                <label for="email" class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Email
                    Address</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                    placeholder="player@example.com">
            </div>
            <button type="submit"
                class="w-full py-3 bg-[#00ff00] text-black font-extrabold uppercase tracking-wide rounded-sm shadow-[0_0_15px_rgba(0,255,0,0.3)] hover:bg-[#00cc00] transition-all">
                Send OTP
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            Remembered your password?
            <a href="#" id="backToLogin"
                class="text-[#00ff00] hover:text-[#00cc00] font-bold transition duration-200">Log In</a>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
