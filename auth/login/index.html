<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arena Chain</title>
    <link href="../../src/output.css" rel="stylesheet">
</head>

<body
    class="bg-black text-white font-sans antialiased h-screen flex items-center justify-center overflow-hidden relative selection:bg-green-500 selection:text-black">

    <!-- Subtle Background Gradient -->
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 to-black z-0"></div>

    <!-- Login Container -->
    <div
        class="relative z-10 w-full max-w-[900px] bg-[#0f0f0f] border border-gray-800 rounded-3xl p-8 shadow-2xl flex flex-col md:flex-row gap-8 items-center">

        <!-- Left Side: Login Form -->
        <div class="w-full md:w-1/2">
            <!-- Back to Home Removed -->

            <div class="flex flex-col items-center mb-8 mt-2">
                <!-- Logo Icon -->
                <div
                    class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center mb-4 border border-gray-700 text-green-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-7 h-7">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
                    </svg>
                </div>

                <h1 class="text-2xl font-bold text-white tracking-wide uppercase">Welcome Back</h1>
                <p class="text-gray-500 text-sm mt-1">Enter your credentials to access the arena.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="email"
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Email
                        or Username</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                        placeholder="player@example.com">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password"
                            class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-[10px] font-bold text-green-500 hover:text-green-400">Forgot
                            Password?</a>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                        placeholder="••••••••">
                </div>

                <button type="submit"
                    class="w-full py-3 bg-[#00ff00] text-black font-extrabold uppercase tracking-wide rounded-sm shadow-[0_0_15px_rgba(0,255,0,0.3)] hover:bg-[#00cc00] hover:shadow-[0_0_20px_rgba(0,255,0,0.5)] transform transition-all duration-200 focus:outline-none flex items-center justify-center gap-2">
                    Log In
                </button>
            </form>

            <div class="relative mt-6 mb-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-800"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-[#0f0f0f] px-2 text-gray-500 font-bold tracking-wider">Or</span>
                </div>
            </div>

            <button
                class="w-full py-3 bg-transparent border border-gray-700 text-white font-medium rounded-sm hover:bg-gray-800 transition-colors duration-200 flex items-center justify-center gap-2 group">
                <svg class="w-4 h-4 text-white group-hover:text-green-400 transition-colors" fill="currentColor"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" />
                </svg>
                <span class="text-sm">Continue with Google</span>
            </button>

            <div class="mt-8 text-center text-sm text-gray-500">
                Don't have an account?
                <a href="#" id="goToRegister"
                    class="text-[#00ff00] hover:text-[#00cc00] font-bold transition duration-200">Register Now</a>
            </div>
        </div>

        <!-- Vertical Divider (Hidden on mobile) -->
        <div class="hidden md:block w-px bg-gray-800 self-stretch mx-4"></div>

        <!-- Right Side: QR Code Login -->
        <div class="w-full md:w-1/2 flex flex-col items-center justify-center text-center">

            <div class="bg-white p-4 rounded-xl mb-6 shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                <!-- QR Code Image -->
                <img id="qr-code" class="w-48 h-48 object-contain" alt="QR Code Login" />
            </div>

            <h2 class="text-xl font-bold text-white mb-2">Log in With QR Code</h2>
            <p class="text-gray-400 text-sm max-w-[200px]">
                Scan this with the mobile app to log in instantly
            </p>
        </div>

    </div>

    <script src="renderer.js"></script>
</body>

</html>
