<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Arena Chain</title>
    <link href="../../src/output.css" rel="stylesheet">
</head>

<body
    class="bg-black text-white font-sans antialiased h-screen flex items-center justify-center overflow-hidden relative selection:bg-green-500 selection:text-black">

    <!-- Subtle Background Gradient -->
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 to-black z-0"></div>

    <!-- Register Container -->
    <div class="relative z-10 w-full max-w-[500px] bg-[#0f0f0f] border border-gray-800 rounded-3xl p-8 shadow-2xl">

        <!-- Back to Home -->
        <div class="absolute top-8 left-8">
            <a href="#" id="backToHome"
                class="text-gray-400 hover:text-white text-sm flex items-center gap-1 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Back to Home
            </a>
        </div>

        <div class="flex flex-col items-center mb-6 mt-6">
            <!-- Logo Icon -->
            <div
                class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center mb-4 border border-gray-700 text-green-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-white tracking-wide uppercase">Join the Arena</h1>
            <p class="text-gray-500 text-sm mt-1">Choose your role and start your journey.</p>
        </div>

        <form id="registerForm" class="space-y-4">

            <!-- Role Selection -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <label class="cursor-pointer group">
                    <input type="radio" name="role" value="player" class="peer sr-only" checked>
                    <div
                        class="px-2 py-4 rounded-xl border border-gray-700 bg-[#1a1a1a] text-gray-400 flex flex-col items-center justify-center gap-2 peer-checked:bg-[#1a1a1a] peer-checked:text-[#00ff00] peer-checked:border-[#00ff00] hover:border-gray-500 transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                        <span class="text-[10px] font-bold uppercase tracking-wider">Player</span>
                    </div>
                </label>
                <label class="cursor-pointer group">
                    <input type="radio" name="role" value="team_manager" class="peer sr-only">
                    <div
                        class="px-2 py-4 rounded-xl border border-gray-700 bg-[#1a1a1a] text-gray-400 flex flex-col items-center justify-center gap-2 peer-checked:bg-[#1a1a1a] peer-checked:text-[#00ff00] peer-checked:border-[#00ff00] hover:border-gray-500 transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
                        </svg>
                        <span class="text-[10px] font-bold uppercase tracking-wider">Manager</span>
                    </div>
                </label>
                <label class="cursor-pointer group">
                    <input type="radio" name="role" value="referee" class="peer sr-only">
                    <div
                        class="px-2 py-4 rounded-xl border border-gray-700 bg-[#1a1a1a] text-gray-400 flex flex-col items-center justify-center gap-2 peer-checked:bg-[#1a1a1a] peer-checked:text-[#00ff00] peer-checked:border-[#00ff00] hover:border-gray-500 transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
                        </svg>
                        <span class="text-[10px] font-bold uppercase tracking-wider">Referee</span>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="firstName"
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                        placeholder="GamerTag123">
                </div>
                <div>
                    <label for="email"
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Email
                        Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                        placeholder="user@example.com">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="password"
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                        placeholder="••••••••">
                </div>
                <div>
                    <label for="confirmPassword"
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Confirm
                        Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                        class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                class="w-full py-3 bg-[#00ff00] text-black font-extrabold uppercase tracking-wide rounded-sm shadow-[0_0_15px_rgba(0,255,0,0.3)] hover:bg-[#00cc00] hover:shadow-[0_0_20px_rgba(0,255,0,0.5)] transform transition-all duration-200 focus:outline-none mt-4">
                Create Player Account
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            Already have an account?
            <a href="#" id="goToLogin" class="text-[#00ff00] hover:text-[#00cc00] font-bold transition duration-200">Log
                In</a>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script>
        // Update button text based on role selection
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const submitBtn = document.querySelector('button[type="submit"]');

        roleInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                const role = e.target.value.charAt(0).toUpperCase() + e.target.value.slice(1).replace('_', ' ');
                submitBtn.textContent = `Create ${role} Account`;
            });
        });
    </script>
</body>

</html>
