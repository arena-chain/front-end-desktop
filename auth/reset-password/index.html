<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Arena Chain</title>
    <link href="../../src/output.css" rel="stylesheet">
</head>

<body
    class="bg-black text-white font-sans antialiased h-screen flex items-center justify-center overflow-hidden relative">
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 to-black z-0"></div>
    <div
        class="relative z-10 w-full max-w-[450px] bg-[#0f0f0f] border border-gray-800 rounded-3xl p-8 shadow-2xl flex flex-col items-center">
        <div
            class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center mb-6 border border-gray-700 text-green-500">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wide uppercase mb-2">Reset Password</h1>
        <p class="text-gray-500 text-sm text-center mb-8">Choose a new secure password for your account.</p>

        <form id="resetPasswordForm" class="w-full space-y-6">
            <div>
                <label for="password"
                    class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">New Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                    placeholder="••••••••">
            </div>
            <div>
                <label for="confirmPassword"
                    class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Confirm
                    Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                    class="w-full px-4 py-3 bg-[#1a1a1a] border border-gray-700 rounded-lg focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none transition-all duration-200 text-white placeholder-gray-600 text-sm"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full py-3 bg-[#00ff00] text-black font-extrabold uppercase tracking-wide rounded-sm shadow-[0_0_15px_rgba(0,255,0,0.3)] hover:bg-[#00cc00] transition-all">
                Reset Password
            </button>
        </form>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
