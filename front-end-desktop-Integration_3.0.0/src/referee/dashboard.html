<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referee Dashboard - Arena Chain</title>
    <link href="../output.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-white font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-yellow-500 flex items-center gap-2">
                <span> whistle </span> Arena Chain
            </h1>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" class="block px-4 py-3 bg-gray-700 text-white rounded-lg font-medium">Dashboard</a>
            <a href="#"
                class="block px-4 py-3 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Matches
                to Officiate</a>
            <a href="#"
                class="block px-4 py-3 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Dispute
                Reports</a>
            <a href="#"
                class="block px-4 py-3 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Rules &
                Regulations</a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <button id="logoutBtn"
                class="w-full py-2 bg-red-600 bg-opacity-20 text-red-400 hover:bg-opacity-30 rounded-lg transition text-sm font-semibold">
                Log Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-bold">Referee Center</h2>
                <p class="text-gray-400">Manage fair play and match integrity</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-yellow-600 rounded-full flex items-center justify-center">R</div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Upcoming Matches</h3>
                <p class="text-3xl font-bold">5</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Pending Disputes</h3>
                <p class="text-3xl font-bold text-yellow-500">2</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Reputation Score</h3>
                <p class="text-3xl font-bold text-green-400">4.9/5</p>
            </div>
        </div>

        <!-- Assignments List -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="p-6 border-b border-gray-700">
                <h3 class="text-lg font-bold">Upcoming Assignments</h3>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div
                        class="flex items-center justify-between p-4 bg-gray-900 rounded-lg border-l-4 border-blue-500">
                        <div>
                            <h4 class="font-bold">Team Alpha vs. Team Beta</h4>
                            <p class="text-sm text-gray-400">Today, 20:00 UTC</p>
                        </div>
                        <button
                            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm font-semibold transition">Enter
                            Lobby</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="renderer.js"></script>
</body>

</html>
