<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification History - Arena Chain</title>
    <meta name="description" content="Browse your Arena Chain notification history." />
    <link rel="stylesheet" href="../../output.css" />
    <script src="../_common/loadComponents.js"></script>
    <script src="../_common/notification.js"></script>
</head>
<body class="m-0 h-screen overflow-hidden bg-[#0a0c0f] text-white antialiased">
    <div class="flex h-full w-full min-w-0 overflow-hidden">
        <common-navbar src="left_side_navbar.html"></common-navbar>

        <main class="flex min-w-0 flex-1 flex-col overflow-hidden">
            <common-navbar src="top_navbar.html"></common-navbar>

            <div class="flex-1 overflow-y-auto overflow-x-hidden px-6 py-8 lg:px-10">
                <div class="mx-auto flex max-w-6xl flex-col gap-8">
                    <div class="flex flex-wrap items-end justify-between gap-4">
                        <div>
                            <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#00ff87]">
                                Notifications Module
                            </p>
                            <h1 class="mt-2 text-3xl font-black uppercase tracking-tight text-white">
                                History
                            </h1>
                            <p class="mt-2 max-w-2xl text-sm text-gray-400">
                                Realtime alerts, read state, archived items, and quick actions are all centralized here.
                            </p>
                        </div>

                        <div class="flex flex-wrap gap-2">
                            <a
                                href="./notifications_settings.html"
                                class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-black uppercase tracking-wide text-white transition hover:bg-white/10"
                            >
                                Preferences
                            </a>
                            <button
                                id="history-refresh"
                                type="button"
                                class="rounded-xl border border-[#00ff87]/20 bg-[#00ff87]/10 px-4 py-2 text-xs font-black uppercase tracking-wide text-[#00ff87] transition hover:bg-[#00ff87]/15"
                            >
                                Refresh
                            </button>
                        </div>
                    </div>

                    <section class="grid gap-4 md:grid-cols-4">
                        <div class="rounded-2xl border border-white/5 bg-[#111318] p-5">
                            <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-gray-500">Total</p>
                            <p id="history-total" class="mt-3 text-3xl font-black text-white">0</p>
                        </div>
                        <div class="rounded-2xl border border-white/5 bg-[#111318] p-5">
                            <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-gray-500">Unread</p>
                            <p id="history-unread" class="mt-3 text-3xl font-black text-[#00ff87]">0</p>
                        </div>
                        <div class="rounded-2xl border border-white/5 bg-[#111318] p-5">
                            <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-gray-500">Archived</p>
                            <p id="history-archived" class="mt-3 text-3xl font-black text-yellow-300">0</p>
                        </div>
                        <div class="rounded-2xl border border-white/5 bg-[#111318] p-5">
                            <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-gray-500">Transport</p>
                            <p id="history-transport" class="mt-3 text-xl font-black uppercase tracking-wide text-white">
                                Idle
                            </p>
                        </div>
                    </section>

                    <section class="overflow-hidden rounded-2xl border border-white/5 bg-[#111318]">
                        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/5 bg-white/[0.02] px-6 py-4">
                            <div class="flex flex-wrap gap-2" id="history-filters">
                                <button data-filter="all" class="history-filter rounded-xl border border-[#00ff87]/20 bg-[#00ff87]/15 px-4 py-2 text-xs font-black uppercase tracking-wide text-[#00ff87]">
                                    All
                                </button>
                                <button data-filter="unread" class="history-filter rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-black uppercase tracking-wide text-white">
                                    Unread
                                </button>
                                <button data-filter="archived" class="history-filter rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-black uppercase tracking-wide text-white">
                                    Archived
                                </button>
                            </div>

                            <div class="flex flex-wrap gap-2">
                                <button
                                    id="history-mark-all"
                                    type="button"
                                    class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-black uppercase tracking-wide text-white transition hover:bg-white/10"
                                >
                                    Mark All Read
                                </button>
                                <button
                                    id="history-clear-all"
                                    type="button"
                                    class="rounded-xl border border-red-400/20 bg-red-500/10 px-4 py-2 text-xs font-black uppercase tracking-wide text-red-300 transition hover:bg-red-500/15"
                                >
                                    Clear All
                                </button>
                            </div>
                        </div>

                        <div id="history-list" class="divide-y divide-white/5"></div>

                        <div id="history-empty" class="hidden px-6 py-16 text-center">
                            <p class="text-sm font-bold text-gray-500">No notifications match this filter.</p>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="./notifications_history.js"></script>
</body>
</html>
