<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA - Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0b0f; margin: 0; overflow: hidden; height: 100vh; }
        .terminal-grid { 
            display: grid; 
            grid-template-columns: 1fr 320px 320px;
            grid-template-rows: 64px 1fr 280px;
            height: 100vh;
            gap: 2px;
            background: #000;
        }
        .panel { background: #111216; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header { height: 36px; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 12px; display: flex; items-center: center; justify-content: space-between; shrink-0: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .trade-up { color: #00ff87; }
        .trade-down { color: #ff3b69; }
        .order-bar { position: absolute; right: 0; height: 100%; opacity: 0.15; transition: width 0.3s ease; }
    </style>
    <script src="../_common/loadComponents.js"></script>
</head>
<body class="text-white antialiased">
    <div class="terminal-grid">
        <!-- Header -->
        <header class="col-span-3 panel flex items-center px-4 flex-row justify-between border-b border-white/5 z-50">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#00ff87] rounded-lg flex items-center justify-center font-black italic text-black text-xl">A</div>
                    <span class="font-black uppercase tracking-tighter text-xl">Arena <span class="text-[#00ff87] italic">Terminal</span></span>
                </div>
                <div class="h-8 w-px bg-white/10"></div>
                <div class="flex items-center gap-4">
                    <div class="relative group" id="asset-selector">
                        <button class="flex items-center gap-3 bg-white/5 border border-white/10 px-4 py-2 rounded-xl hover:border-[#00ff87]/50 transition-all min-w-[240px]">
                            <img src="" id="current-asset-img" class="w-6 h-6 rounded-md object-cover bg-black/50">
                            <div class="flex flex-col items-start flex-1">
                                <span class="text-xs font-bold" id="current-asset-name">Select Asset...</span>
                                <span class="text-[9px] text-[#00ff87] uppercase tracking-widest" id="current-asset-rarity">---</span>
                            </div>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500"></i>
                        </button>
                        <!-- Dropdown -->
                        <div id="asset-dropdown" class="absolute top-full mt-2 left-0 w-[320px] max-h-[480px] bg-[#1a1b1f] border border-white/10 rounded-2xl shadow-2xl z-[100] hidden flex-col p-2 gap-1 overflow-y-auto custom-scrollbar">
                            <!-- Assets list populated via JS -->
                        </div>
                    </div>
                    <div class="flex items-center gap-5">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-500 uppercase font-black">Last Price</span>
                            <span class="text-sm font-black text-[#00ff87]" id="ticker-price">0.00 AC</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-500 uppercase font-black">24h Change</span>
                            <span class="text-sm font-black text-[#00ff87]" id="ticker-change">+0.00%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 bg-[#00ff87]/10 border border-[#00ff87]/20 px-4 py-2 rounded-xl">
                    <i data-lucide="wallet" class="w-4 h-4 text-[#00ff87]"></i>
                    <span class="text-sm font-black tracking-tight" id="user-balance">12,450.00 AC</span>
                </div>
                <button onclick="window.location.href='./market.html'" class="p-2.5 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all">
                    <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
                </button>
            </div>
        </header>

        <!-- Chart -->
        <main class="panel border-r border-white/5 relative" id="chart-panel">
            <div class="panel-header">
                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-black uppercase text-gray-500 tracking-widest">Price Chart</span>
                    <div class="flex items-center gap-1">
                        <button class="px-2 py-0.5 rounded bg-[#00ff87]/10 text-[#00ff87] text-[9px] font-bold">1H</button>
                        <button class="px-2 py-0.5 rounded hover:bg-white/5 text-gray-500 text-[9px] font-bold">4H</button>
                        <button class="px-2 py-0.5 rounded hover:bg-white/5 text-gray-500 text-[9px] font-bold">1D</button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <i data-lucide="maximize-2" class="w-3 h-3 text-gray-600"></i>
                </div>
            </div>
            <div id="chart-container" class="flex-1 w-full"></div>
        </main>

        <!-- Order Book -->
        <aside class="panel border-r border-white/5">
            <div class="panel-header">
                <span class="text-[10px] font-black uppercase text-gray-500 tracking-widest">Order Book</span>
                <span class="text-[9px] font-bold text-gray-600">Spread: 2.50 AC</span>
            </div>
            <div class="flex-1 flex flex-col overflow-hidden text-[11px] font-medium">
                <!-- Asks (Sells) -->
                <div class="flex-1 flex flex-col-reverse overflow-hidden" id="orderbook-asks"></div>
                <!-- Middle Price -->
                <div class="h-10 bg-black/40 flex items-center justify-between px-3 shrink-0 border-y border-white/5">
                    <span class="text-lg font-black text-[#00ff87]" id="mid-price">2,500.00</span>
                    <span class="text-[10px] text-gray-500 italic">$125.00</span>
                </div>
                <!-- Bids (Buys) -->
                <div class="flex-1 overflow-hidden" id="orderbook-bids"></div>
            </div>
        </aside>

        <!-- Trade History -->
        <aside class="panel">
            <div class="panel-header">
                <span class="text-[10px] font-black uppercase text-gray-500 tracking-widest">Market Trades</span>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar" id="market-trades">
                <table class="w-full text-left text-[11px]">
                    <thead class="sticky top-0 bg-[#111216] text-gray-600 uppercase text-[9px] font-black">
                        <tr>
                            <th class="p-3">Price</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Time</th>
                        </tr>
                    </thead>
                    <tbody id="trades-list">
                        <!-- Rows via JS -->
                    </tbody>
                </table>
            </div>
        </aside>

        <!-- Order Entry -->
        <section class="panel border-t border-white/5 p-5">
            <div class="flex gap-10 h-full">
                <div class="flex-1 flex flex-col gap-5">
                    <div class="flex items-center gap-1 p-1 bg-black/40 rounded-xl w-fit">
                        <button id="buy-tab-btn" class="px-6 py-2 rounded-lg bg-[#00ff87] text-black text-xs font-black uppercase">Buy</button>
                        <button id="sell-tab-btn" class="px-6 py-2 rounded-lg text-gray-500 text-xs font-black uppercase hover:text-white">Sell</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Price (AC)</label>
                            <div class="relative">
                                <input type="number" id="order-price" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-[#00ff87]/50" value="2500">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-black text-gray-600 uppercase">AC</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Amount</label>
                            <div class="relative">
                                <input type="number" id="order-amount" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-[#00ff87]/50" value="1">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-black text-gray-600 uppercase">QTY</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="w-[320px] flex flex-col justify-between py-2 border-l border-white/5 pl-10">
                    <div class="space-y-3">
                        <div class="flex justify-between text-xs"><span class="text-gray-500 font-bold uppercase">Estimated Total</span> <span class="font-black text-white" id="order-total">2,500.00 AC</span></div>
                        <div class="flex justify-between text-xs"><span class="text-gray-500 font-bold uppercase">Transaction Fee</span> <span class="font-black text-white">12.50 AC</span></div>
                    </div>
                    <button id="execute-order-btn" class="w-full py-4 rounded-2xl bg-[#00ff87] text-black font-black uppercase tracking-[0.2em] shadow-[0_0_40px_rgba(0,255,135,0.15)] hover:scale-[1.02] active:scale-[0.98] transition-all">
                        Execute Buy Order
                    </button>
                </div>
            </div>
        </section>

        <!-- Position & Portfolio -->
        <section class="panel border-t border-white/5 col-span-2">
            <div class="panel-header">
                <div class="flex gap-6">
                    <button class="text-[10px] font-black uppercase text-white border-b-2 border-[#00ff87] pb-2">Open Positions (0)</button>
                    <button class="text-[10px] font-black uppercase text-gray-500 pb-2 hover:text-white transition-all">Order History</button>
                </div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center opacity-30 gap-3">
                <i data-lucide="layers" class="w-8 h-8"></i>
                <span class="text-[10px] font-black uppercase tracking-widest">No Active Positions</span>
            </div>
        </section>
    </div>

    <script src="./tradingRenderer.js"></script>
</body>
</html>
