            <a href="#" id="nav-tournaments"

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"

            <a href="#" id="nav-leagues"

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"

                </svg>
                <span class="text-sm font-medium">Leagues</span>
            </a>
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-[#1f1f1f] hover:text-white rounded-lg transition group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 group-hover:text-[#00ff00] transition-colors">
                    <path stroke-linecap="round" stroke-linejoin="round"

                </svg>
                <span class="text-sm font-medium">Matches</span>
            </a>
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-[#1f1f1f] hover:text-white rounded-lg transition group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 group-hover:text-[#00ff00] transition-colors">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
                </svg>
                <span class="text-sm font-medium">Channels</span>
            </a>
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-[#1f1f1f] hover:text-white rounded-lg transition group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5 group-hover:text-[#00ff00] transition-colors">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 0 1 0 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <span class="text-sm font-medium">Settings</span>
            </a>
        </nav>
        <div class="p-4 border-t border-[#1f1f1f] mt-auto">
            <div class="flex items-center gap-3 px-4 py-3 mb-2">
                <div
                    class="w-8 h-8 rounded-full bg-[#00ff00] flex items-center justify-center text-black font-bold text-xs">
                    A</div>
                <div>
                    <p class="text-sm font-bold text-white">Admin User</p>
                    <p class="text-xs text-[#00ff00]">Super Admin</p>
                </div>
            </div>
            <button id="logoutBtn"
                class="w-full py-2 flex items-center justify-center gap-2 text-red-500 hover:bg-red-500/10 rounded-lg transition text-sm font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                </svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-black p-8">
        <header class="flex justify-between items-end mb-8 mt-4">
            <div>
                <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Leagues</h2>
                <p class="text-gray-400 mt-1">Manage official platform leagues and settings.</p>
            </div>
            <button id="addLeagueBtn"
                class="px-6 py-2 bg-[#00ff00] hover:bg-[#00cc00] text-black font-bold uppercase text-sm rounded-sm transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                    stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Create League
            </button>
        </header>

        <!-- Leagues Grid -->
        <div id="leaguesListing" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content -->
        </div>

        <div id="loadingState" class="p-20 text-center hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-[#00ff00] mb-4">
            </div>
            <p class="text-gray-500 uppercase text-xs font-black tracking-widest">Loading Leagues...</p>
        </div>

        <div id="emptyState"
            class="p-20 text-center hidden flex flex-col items-center justify-center gap-4 opacity-30 grayscale rounded-3xl border border-dashed border-[#333]">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-16 h-16">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0V5.625a2.25 2.25 0 1 1 4.5 0v3.375M9.497 11.25V5.625a2.25 2.25 0 0 0-4.5 0v3.375m0 0a2.25 2.25 0 0 1-1.313 4.194m16.626 0a2.25 2.25 0 0 0-1.313-4.194" />
            </svg>
            <p class="text-gray-500 uppercase text-xs font-black tracking-widest">No Leagues Found</p>
        </div>
    </main>

    <!-- League Modal -->
    <div id="leagueModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-[#121212] border border-[#333] w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-[#333] flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-black text-white uppercase tracking-tighter">Create New League
                </h3>
                <button id="closeModal" class="text-gray-500 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="leagueForm" class="p-6 space-y-6">
                <input type="hidden" id="leagueId">
                <div class="grid grid-cols-2 gap-6">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">League
                            Name</label>
                        <input type="text" id="leagueName"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition transition-all placeholder-gray-700"
                            placeholder="e.g. Pro League Season 1">
                        <p id="error-name" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Game
                            ID</label>
                        <input type="text" id="gameId"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition placeholder-gray-700"
                            placeholder="e.g. game_123">
                        <p id="error-gameId" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Tier</label>
                        <select id="leagueTier"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition">
                            <option value="OFFICIAL">Official</option>
                            <option value="COMMUNITY">Community</option>
                        </select>
                        <p id="error-tier" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Mode</label>
                        <select id="leagueMode"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition">
                            <option value="SOLO">Solo</option>
                            <option value="TEAM">Team</option>
                        </select>
                        <p id="error-mode" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Region
                            Filter</label>
                        <select id="regionFilter"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition">
                            <option value="GLOBAL">Global</option>
                            <option value="CONTINENT">Continent</option>
                            <option value="COUNTRY">Country</option>
                        </select>
                        <p id="error-regionFilter" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Min
                            ELO</label>
                        <input type="number" id="minElo" value="0" min="0"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition">
                        <p id="error-minElo" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Max
                            Participants</label>
                        <input type="number" id="maxParticipants" value="100" min="2"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition">
                        <p id="error-maxParticipants" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase">
                        </p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Start
                            Date</label>
                        <input type="date" id="startDate"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition"
                            onfocus="this.showPicker()" onclick="this.showPicker()">
                        <p id="error-startDate" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">End
                            Date</label>
                        <input type="date" id="endDate"
                            class="w-full bg-black border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00ff00] transition"
                            onfocus="this.showPicker()" onclick="this.showPicker()">
                        <p id="error-endDate" class="text-red-500 text-[10px] mt-1 hidden font-bold uppercase"></p>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" id="cancelBtn"
                        class="flex-1 px-6 py-3 border border-[#333] text-gray-400 font-bold uppercase text-xs rounded-lg hover:bg-white/5 transition">Cancel</button>
                    <button type="submit"
                        class="flex-1 px-6 py-3 bg-[#00ff00] hover:bg-[#00cc00] text-black font-black uppercase text-xs rounded-lg transition shadow-lg shadow-[#00ff00]/10">Save
                        League</button>
                </div>
            </form>
        </div>
    </div>

    <script src="leagues-renderer.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
